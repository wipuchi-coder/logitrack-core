spring:
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/logitrack}
    username: ${POSTGRES_USER:logitrack}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100
      page-serialization-mode: via-dto
management:
  endpoints:
    web:
      exposure:
        include: health
logitrack:
  username: ${WMS_USERNAME:operator}
  password: ${WMS_PASSWORD}
  jwt-secret: ${JWT_SECRET}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
